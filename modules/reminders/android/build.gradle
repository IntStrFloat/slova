plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.reminders'
version = '0.1.0'

android {
  namespace "expo.modules.reminders"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "expo.modules.reminders.ReminderTestRunner"
  }
}

dependencies {
  // React Native is already provided by the host app; this exposes its permission callback API.
  compileOnly 'com.facebook.react:react-android'
}
