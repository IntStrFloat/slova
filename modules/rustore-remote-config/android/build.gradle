plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.rustoreremoteconfig'
version = '0.1.0'

android {
  namespace 'expo.modules.rustoreremoteconfig'
  defaultConfig { versionCode 1; versionName '0.1.0' }
}

dependencies {
  implementation 'ru.rustore.sdk:remoteconfig:10.5.1'
  compileOnly 'com.facebook.react:react-android'
}
