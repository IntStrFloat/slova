plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.rustorereview'
version = '0.1.0'

android {
  namespace "expo.modules.rustorereview"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'ru.rustore.sdk:review:10.5.1'
  compileOnly 'com.facebook.react:react-android'
}
