plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.rustoreupdates'
version = '0.1.0'

android {
  namespace "expo.modules.rustoreupdates"
  defaultConfig { versionCode 1; versionName "0.1.0" }
}

dependencies {
  implementation 'ru.rustore.sdk:appupdate:10.5.2'
  implementation project(':rustore-review')
  compileOnly 'com.facebook.react:react-android'
}
